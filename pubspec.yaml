name: expenso
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: 3.11.1

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  google_fonts: ^6.3.3
  intl: ^0.20.2
  uuid: ^4.5.2
  fl_chart: ^1.1.1
  http: ^1.6.0
  get_storage: ^2.1.1
  flutter_screenutil: ^5.9.3
  connectivity_plus: ^7.0.0
  hugeicons: ^1.1.7
  supabase_flutter: ^2.12.4
  awesome_snackbar_content: ^0.1.8
  flutter_contacts: ^2.0.2
  flutter_native_splash: ^2.4.7
  package_rename: ^1.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"

  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash.png
  fullscreen: true               
  android_12:
    color: "#FFFFFF"
    image: assets/icon/splash.png    
    icon_background_color: "#FFFFFF"

package_rename_config:
  android:
    app_name: "Expenso"
    package_name: "com.mik.expenso"
   
flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
